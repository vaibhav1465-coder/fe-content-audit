<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FE Content Audit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f3ef; font-family: 'Inter', system-ui, sans-serif; color: #1d1d1d; }
  #root { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
  .login-wrap { width: 100%; max-width: 430px; background: #ffffff; border: 1px solid #e7e1dc; border-radius: 14px; padding: 32px; box-shadow: 0 18px 48px rgba(29, 29, 29, 0.08); }
  .login-kicker { margin: 0 0 10px; color: #6b5c67; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .dashboard-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0 16px; }
  .metric-card { background: #ffffff; border: 1px solid #e7e1dc; border-radius: 10px; padding: 14px 16px; }
  .metric-label { margin: 0 0 6px; color: #696969; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .metric-value { margin: 0; color: #1d1d1d; font-size: 24px; line-height: 1.15; font-weight: 700; }
  .toolbar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .step-label { margin: 0 0 8px; color: #4a154b; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  input[type=text], input[type=number], input[type=password], textarea {
    border: 1px solid #ded8d3; border-radius: 8px; padding: 11px 12px; font-family: inherit; font-size: 14px; color: #1d1d1d; background: #ffffff;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid rgba(74, 21, 75, 0.16); border-color: #4a154b; }
  select { border: 1px solid #ded8d3; border-radius: 8px; padding: 11px 12px; font-family: inherit; font-size: 14px; color: #1d1d1d; background: #ffffff; }
  textarea { width: 100%; font-family: monospace; font-size: 12px; }
  button { font-family: inherit; }
  .page-header, .saved-row, .result-header { display: flex; justify-content: space-between; }
  .saved-actions { display: flex; gap: 6px; }
  @media (max-width: 640px) {
    #root { padding: 20px 12px 48px; }
    .login-wrap { padding: 24px; }
    .dashboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .page-header, .saved-row, .result-header { flex-direction: column; align-items: stretch !important; gap: 12px; }
    .saved-actions { flex-wrap: wrap; }
    .saved-actions button { flex: 1; }
    input, select, textarea { max-width: 100%; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-plugins="transform-react-jsx">
const { useRef, useState } = React;

const C = {
  primary: "#4a154b", onPrimary: "#ffffff", ink: "#1d1d1d", inkMute: "#696969",
  linkBlue: "#1264a3", canvas: "#ffffff", cream: "#f4ede4", lavender: "#f9f0ff",
  hairline: "#e6e6e6", error: "#cc4117", success: "#007a5a",
  errorTint: "#fbe9e3", successTint: "#e3f2ec", warnTint: "#fdf3e3", warn: "#a9660a",
};

const st = {
  h1: { fontSize: "32px", fontWeight: 700, color: C.primary, margin: "0 0 4px" },
  subtitle: { fontSize: "16px", color: C.inkMute, margin: "0 0 20px", lineHeight: 1.55 },
  card: { background: C.canvas, border: "1px solid #e7e1dc", borderRadius: "12px", padding: "24px", marginBottom: "16px", boxShadow: "0 8px 26px rgba(29, 29, 29, 0.035)" },
  cardLavender: { background: "#fbf7fd", border: "1px solid #eadff0", borderRadius: "12px", padding: "24px", marginBottom: "16px" },
  stepTitle: { fontSize: "21px", fontWeight: 700, margin: "0 0 4px" },
  stepDesc: { fontSize: "14px", color: C.inkMute, margin: "0 0 14px", lineHeight: 1.5 },
  btnPrimary: { background: C.primary, color: C.onPrimary, border: "none", borderRadius: "10px", padding: "13px 24px", fontSize: "15px", fontWeight: 700, cursor: "pointer" },
  btnOutline: { background: C.canvas, color: C.primary, border: `1px solid ${C.primary}`, borderRadius: "10px", padding: "10px 18px", fontSize: "14px", fontWeight: 700, cursor: "pointer" },
  btnOutlineError: { background: C.canvas, color: C.error, border: `1px solid ${C.error}`, borderRadius: "10px", padding: "10px 18px", fontSize: "14px", fontWeight: 700, cursor: "pointer" },
  link: { color: C.linkBlue, textDecoration: "underline", fontSize: "13px", fontFamily: "monospace", wordBreak: "break-all", display: "block" },
  pillTag: { fontSize: "12px", fontWeight: 700, padding: "7px 14px", borderRadius: "10px", background: C.lavender, color: C.primary, border: "1px solid transparent", cursor: "pointer" },
  pillTagActive: { fontSize: "12px", fontWeight: 700, padding: "7px 14px", borderRadius: "10px", background: C.primary, color: C.onPrimary, border: "1px solid transparent", cursor: "pointer" },
  pillTagBad: { fontSize: "12px", fontWeight: 700, padding: "7px 14px", borderRadius: "10px", background: C.errorTint, color: C.error, border: "1px solid transparent", cursor: "pointer" },
  pillTagWarn: { fontSize: "12px", fontWeight: 700, padding: "7px 14px", borderRadius: "10px", background: C.warnTint, color: C.warn, border: "1px solid transparent", cursor: "pointer" },
  caption: { fontSize: "12px", color: C.inkMute },
};

const SESSION_KEY = "fe_session_token";
const SESSION_EXPIRY_KEY = "fe_session_expires";
const MEMORY_KEY = "fe_saved_analyses";
const ANALYSIS_INTERVAL_MS = 4200;
const WP_BASE = "https://www.financialexpress.com/wp-json/wp/v2";
const PREPROD_SOURCE_BASE = "/api/source";
const MAX_ARTICLES_PER_REQUEST = 500;
const MAX_AUTO_PAGES_PER_SEGMENT = 20;
const MAX_ANALYSIS_ARTICLES = 500;
const BODY_TEXT_LIMIT = 8000;
const SOURCE_AUDIT_LIMIT = 5000;
const RECOMMENDATION_COUNT_OPTIONS = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500];
const SEGMENT_SCAN_CONCURRENCY = 8;
const MAX_CONSECUTIVE_UPSTREAM_ERRORS = 3;
const FE_SEGMENT_ENDPOINTS = {};
const AI_PROVIDER_OPTIONS = {
  anthropic: [
    { value: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 - lower cost" },
    { value: "claude-sonnet-5", label: "Claude Sonnet 5 - higher quality" },
  ],
  openai: [
    { value: "gpt-5.6-luna", label: "GPT-5.6 Luna - lower cost" },
    { value: "gpt-5.6-terra", label: "GPT-5.6 Terra - balanced" },
    { value: "gpt-4.1", label: "GPT-4.1 - stable general model" },
  ],
};

function getStoredSession() {
  const token = sessionStorage.getItem(SESSION_KEY);
  const expiresAt = Number(sessionStorage.getItem(SESSION_EXPIRY_KEY) || 0);
  if (!token || Date.now() > expiresAt) return null;
  return token;
}
function storeSession(token, expiresAt) {
  sessionStorage.setItem(SESSION_KEY, token);
  sessionStorage.setItem(SESSION_EXPIRY_KEY, String(expiresAt));
}
function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_EXPIRY_KEY);
}

function getSavedAnalyses() {
  try { return JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]"); } catch (e) { return []; }
}
function addSavedAnalysis(entry) {
  const list = getSavedAnalyses();
  list.unshift(entry);
  localStorage.setItem(MEMORY_KEY, JSON.stringify(list.slice(0, 50)));
}
function deleteSavedAnalysis(timestamp) {
  const list = getSavedAnalyses().filter((e) => e.timestamp !== timestamp);
  localStorage.setItem(MEMORY_KEY, JSON.stringify(list));
}

async function login(password) {
  const res = await fetch("/api/auth", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Login failed");
  storeSession(data.token, data.expiresAt);
}

async function callAnalyzeApi(article, mode, costProfile, aiProvider, aiModel) {
  const token = getStoredSession();
  if (!token) throw new Error("Session expired. Please log in again.");
  const response = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify({ article, mode, cost_profile: costProfile, ai_provider: aiProvider, ai_model: aiModel }),
  });
  if (response.status === 401) { clearSession(); throw new Error("Session expired. Please log in again."); }
  if (!response.ok) {
    const errBody = await response.json().catch(() => ({}));
    const signal = errBody.config_signal ? ` [provider=${errBody.config_signal.provider}, model=${errBody.config_signal.model}, key=${errBody.config_signal.key_fingerprint}]` : "";
    const detail = errBody.detail ? ` - ${errBody.detail}` : "";
    throw new Error((errBody.error || `Request failed with status ${response.status}`) + detail + signal);
  }
  return response.json();
}

function getAuthHeaders() {
  const token = getStoredSession();
  return token ? { Authorization: `Bearer ${token}` } : {};
}

function buildSourceApiUrl(kind, params = {}) {
  const search = new URLSearchParams({ kind });
  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null && String(value).trim() !== "") {
      search.set(key, String(value));
    }
  });
  return `${PREPROD_SOURCE_BASE}?${search.toString()}`;
}

async function fetchWpJson(url) {
  const response = await fetch(url, { headers: getAuthHeaders() });
  const text = await response.text();
  let parsed;
  try { parsed = text ? JSON.parse(text) : null; }
  catch (e) { throw new Error("The source API returned unreadable JSON."); }
  if (!response.ok) {
    const wpError = detectWpRestError(parsed);
    throw new Error(wpError ? `${wpError.status} ${wpError.code.replace(/_/g, " ")}` : `HTTP ${response.status}`);
  }
  return parsed;
}

function wait(ms) { return new Promise((resolve) => window.setTimeout(resolve, ms)); }

function detectWpRestError(parsed) {
  if (parsed && typeof parsed === "object" && parsed.code && parsed.data?.status) {
    return { status: parsed.data.status, code: parsed.code };
  }
  return null;
}

function clampArticlesPerPage(value) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) return 50;
  return Math.max(1, Math.min(MAX_ARTICLES_PER_REQUEST, Math.floor(parsed)));
}

function getDefaultModelForProvider(provider, costProfile) {
  const options = AI_PROVIDER_OPTIONS[provider] || AI_PROVIDER_OPTIONS.anthropic;
  return costProfile === "standard" ? (options[1]?.value || options[0].value) : options[0].value;
}

function clampRecommendationLimit(value, total) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) return Math.min(50, total || 50);
  return Math.max(1, Math.min(total || parsed, parsed));
}

function toUserMessage(message, fallback = "Something went wrong. Please try again.") {
  const text = String(message || "").trim();
  if (!text) return fallback;
  if (/session expired/i.test(text)) return "Your session expired. Please log in again.";
  if (/rate limit exceeded/i.test(text)) return "Too many requests were sent in a short time. Please wait a minute and try again.";
  if (/daily request cap/i.test(text)) return "Today's analysis limit has been reached. Please try again later.";
  if (/configured anthropic model is not available/i.test(text)) return "The selected Claude model is not available right now. Choose another model and try again.";
  if (/source api returned unreadable json/i.test(text)) return "This source did not return usable page data for the selected segment or month.";
  if (/could not parse model output/i.test(text)) return "The selected model returned an unusable response. Please retry.";
  if (/analysis response was incomplete or not grounded/i.test(text)) return "The analysis could not finish cleanly for this page. Please retry.";
  if (/upstream api error/i.test(text)) return "The analysis provider is not responding correctly right now. Please retry.";
  if (/server misconfigured/i.test(text)) return "The analysis service is not fully configured right now.";
  if (/internal error/i.test(text)) return "The analysis service hit an internal error. Please retry.";
  if (/missing authorization header|malformed token/i.test(text)) return "Please use this inside the FE Content Audit app after logging in.";
  if (/http 4\d\d/i.test(text)) return "The requested content could not be loaded for this selection.";
  if (/http 5\d\d/i.test(text)) return "The content service is temporarily unavailable. Please retry.";
  return text;
}

function buildArticleUrl(categoryId, selectedMonthValue, perPage, page) {
  const { after, before } = getMonthRange(selectedMonthValue);
  return buildSourceApiUrl("posts", {
    categories: String(categoryId),
    after,
    before,
    per_page: String(clampArticlesPerPage(perPage)),
    page: String(page),
    orderby: "date",
    order: "desc",
  });
}

function buildLatestFeedUrl(perPage) {
  return `${WP_BASE}/category/latest/100/${clampArticlesPerPage(perPage)}`;
}

async function fetchJsonWithMeta(url) {
  const response = await fetch(url, { headers: getAuthHeaders() });
  const text = await response.text();
  let parsed;
  try { parsed = text ? JSON.parse(text) : null; }
  catch (e) { throw new Error("The source API returned unreadable JSON."); }
  if (!response.ok) {
    const wpError = detectWpRestError(parsed);
    throw new Error(wpError ? `${wpError.status} ${wpError.code.replace(/_/g, " ")}` : `HTTP ${response.status}`);
  }
  return {
    data: parsed,
    total: Number(response.headers.get("X-WP-Total") || 0),
    totalPages: Number(response.headers.get("X-WP-TotalPages") || 1),
  };
}

function formatDate(dateStr) {
  if (!dateStr) return "no date";
  const d = new Date(dateStr.replace(" ", "T"));
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function stripHtml(value) {
  const element = document.createElement("textarea");
  element.innerHTML = String(value || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  return element.value;
}

function formatByline(value) {
  return String(value || "").replace(/^cap-/, "").split("-").filter(Boolean).map((part) => part.toLowerCase() === "fe" ? "FE" : part.charAt(0).toUpperCase() + part.slice(1)).join(" ");
}

async function resolveBylines(articles) {
  const ids = [...new Set(articles.flatMap((article) => article._coauthorIds || []))];
  if (!ids.length) return articles;
  try {
    const response = await fetch(buildSourceApiUrl("coauthors", { include: ids.join(","), per_page: 100 }), { headers: getAuthHeaders() });
    if (!response.ok) return articles;
    const authors = await response.json();
    const names = Object.fromEntries(authors.map((author) => [String(author.id), formatByline(author.name || author.slug)]));
    return articles.map((article) => ({ ...article, byline: (article._coauthorIds || []).map((id) => names[String(id)]).filter(Boolean).join(", ") || article.byline }));
  } catch { return articles; }
}

function getMonthOptions() {
  const now = new Date();
  const first = new Date(now.getFullYear() - 1, 0, 1);
  const options = [{ value: "last-12-months", label: "Last 12 months" }];
  for (const date = new Date(now.getFullYear(), now.getMonth(), 1); date >= first; date.setMonth(date.getMonth() - 1)) {
    options.push({ value: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`, label: date.toLocaleDateString("en-GB", { month: "long", year: "numeric" }) });
  }
  return options;
}

function getMonthRange(value) {
  if (value === "last-12-months") {
    const now = new Date();
    return {
      after: new Date(Date.UTC(now.getFullYear(), now.getMonth() - 11, 1)).toISOString(),
      before: new Date(Date.UTC(now.getFullYear(), now.getMonth() + 1, 1)).toISOString(),
    };
  }
  const [year, month] = value.split("-").map(Number);
  const start = new Date(Date.UTC(year, month - 1, 1));
  const end = new Date(Date.UTC(year, month, 1));
  return { after: start.toISOString(), before: end.toISOString() };
}

function normalizeArticles(raw, segment) {
  try {
    if (Array.isArray(raw)) {
      return raw.map((it) => ({
        id: String(it.id), headline: stripHtml(it.title?.rendered), subheading: stripHtml(it.excerpt?.rendered),
        byline: formatByline(it.class_list?.find((item) => item.startsWith("author-"))?.slice(7)), _coauthorIds: it.coauthors || [], publish_date: it.date,
        body_text: stripHtml(it.content?.rendered), url: it.link, segment, category_ids: it.categories || [], category_slugs: [],
      }));
    }
    if (Array.isArray(raw?.list?.[0]?.items)) {
      return raw.list[0].items.map((it) => ({
        id: String(it.id), headline: stripHtml(it.headline || it.title), subheading: stripHtml(it.introduction),
        byline: (it.byline || []).map((b) => b.name).join(", "), publish_date: it.post_date,
        body_text: stripHtml(it.body_raw || it.body), url: it.post_url, segment,
        category_ids: (it.categories || []).map((category) => Number(category.id)),
        category_slugs: (it.categories || []).map((category) => String(category.slug || "")),
      }));
    }
  } catch (e) { return []; }
  return [];
}

async function fetchLatestFallbackArticles(segmentSlug, categoryId, selectedMonthValue, perPage) {
  const raw = await fetchWpJson(buildLatestFeedUrl(Math.max(perPage, 100)));
  const { after, before } = getMonthRange(selectedMonthValue);
  const filtered = normalizeArticles(raw, segmentSlug).filter((article) => {
    const published = new Date(String(article.publish_date).replace(" ", "T"));
    const inDateRange = !Number.isNaN(published.getTime()) && published >= new Date(after) && published < new Date(before);
    const inSegment = article.category_ids?.includes(Number(categoryId)) || article.category_slugs?.includes(segmentSlug);
    return inDateRange && inSegment;
  }).slice(0, clampArticlesPerPage(perPage));
  return resolveBylines(filtered);
}

async function fetchSegmentFeedArticles(segmentSlug, selectedMonthValue, perPage, offset = 0) {
  return [];
}

async function checkSegmentAvailability(segmentSlug, categoryId, selectedMonthValue) {
  try {
    const result = await fetchJsonWithMeta(buildArticleUrl(categoryId, selectedMonthValue, 1, 1));
    if (Array.isArray(result.data) && result.data.length > 0) {
      return { type: "ready", reason: "" };
    }
    if (result.total > 0) {
      return { type: "ready", reason: "" };
    }
  } catch (apiError) {
    if (/unreadable json/i.test(apiError.message)) {
      return { type: "unsupported", reason: "This segment is returning HTML or unreadable JSON for the selected month." };
    }
    try {
      const fallbackArticles = await fetchLatestFallbackArticles(segmentSlug, categoryId, selectedMonthValue, 1);
      if (fallbackArticles.length > 0) {
        return { type: "ready", reason: "" };
      }
      return { type: "empty", reason: "No pages were found for this month and segment." };
    } catch (fallbackError) {
      const message = /unreadable json/i.test(fallbackError.message)
        ? "This segment did not return usable page data for the selected month."
        : "This segment could not be loaded from the current source for the selected month.";
      return { type: "unsupported", reason: message };
    }
  }
  return { type: "empty", reason: "No pages were found for this month and segment." };
}

function textContainsAny(text, patterns) {
  const normalized = String(text || "").toLowerCase();
  return patterns.some((pattern) => normalized.includes(pattern));
}

function countMatches(text, regex) {
  return (String(text || "").match(regex) || []).length;
}

function buildSourceOnlyResult(article) {
  const bodyText = String(article.body_text || "").slice(0, BODY_TEXT_LIMIT);
  const bodyLower = bodyText.toLowerCase();
  const wordCount = bodyText.trim() ? bodyText.trim().split(/\s+/).length : 0;
  const hasByline = Boolean(String(article.byline || "").trim());
  const sourceSignals = countMatches(bodyText, /https?:\/\/|according to|said|told|data|report|survey|filing|statement|exchange|ministry|rbi|sebi|nse|bse/gi);
  const expertSignals = countMatches(bodyText, /said|told|according to|analyst|expert|economist|official|spokesperson|ceo|cfo|md|founder|research head/gi);
  const headings = countMatches(bodyText, /\n[A-Z][^\n]{10,90}\n/g);
  const findings = [];

  if (!hasByline) {
    findings.push({
      severity: "yellow",
      issue_name: "Byline unavailable",
      evidence: article.headline || "Article headline",
      what_is_wrong: "The source data does not provide a clear byline for this article.",
      why_it_hurts: "Readers and editors have less context about accountability and expertise.",
      fix: "Confirm the author/byline in the CMS and add a named byline where appropriate.",
      optimization_steps: ["Check the CMS author field.", "Add or correct the visible byline.", "Link to an author profile when available."],
      expected_improvement: "A clear byline improves transparency and editorial trust.",
    });
  }

  if (wordCount < 300) {
    findings.push({
      severity: "red",
      issue_name: "Thin article body",
      evidence: bodyText.slice(0, 90) || article.headline || "Article body",
      what_is_wrong: `The article has about ${wordCount} words, which may not give readers enough useful context.`,
      why_it_hurts: "Thin pages often fail to answer follow-up reader questions.",
      fix: "Expand the article with concrete context, data, and next-step explanation.",
      optimization_steps: ["Add the key background in simple language.", "Explain why the update matters now.", "Add one useful data point or source."],
      expected_improvement: "More complete context can make the page more useful for readers.",
    });
  }

  if (sourceSignals < 2) {
    findings.push({
      severity: "yellow",
      issue_name: "Weak sourcing signals",
      evidence: bodyText.slice(0, 90) || article.headline || "Article body",
      what_is_wrong: "The article has limited visible source, data, or attribution signals.",
      why_it_hurts: "YMYL and business content needs clear support for important claims.",
      fix: "Add named sources, official data, or document links for the main claims.",
      optimization_steps: ["Identify the main factual claim.", "Add the primary source or official data point.", "Attribute important claims to named people or institutions."],
      expected_improvement: "Better sourcing makes the article easier to trust and verify.",
    });
  }

  if (expertSignals < 1 && textContainsAny(bodyLower, ["tax", "loan", "investment", "insurance", "health", "stock", "market", "policy", "rbi", "sebi"])) {
    findings.push({
      severity: "yellow",
      issue_name: "No expert context detected",
      evidence: article.headline || bodyText.slice(0, 90) || "Article headline",
      what_is_wrong: "The article appears to cover a high-impact topic without clear expert explanation.",
      why_it_hurts: "Readers may need qualified context before acting on the information.",
      fix: "Add a short expert quote or editor explanation that clarifies what readers should take away.",
      optimization_steps: ["Ask a qualified expert for one practical quote.", "Explain the reader impact in plain language.", "Avoid direct advice unless it is properly qualified."],
      expected_improvement: "Expert context can make the article safer and more helpful.",
    });
  }

  if (headings < 1 && wordCount > 600) {
    findings.push({
      severity: "yellow",
      issue_name: "Needs clearer structure",
      evidence: bodyText.slice(0, 90) || article.headline || "Article body",
      what_is_wrong: "The article is long enough to benefit from clearer sectioning.",
      why_it_hurts: "Readers may miss the main points when the page is hard to scan.",
      fix: "Add short, descriptive subheadings around the main reader questions.",
      optimization_steps: ["Group related paragraphs together.", "Add one subheading for context.", "Add one subheading for reader impact or next steps."],
      expected_improvement: "Clearer structure helps readers scan and understand the content faster.",
    });
  }

  const finalFindings = findings.slice(0, 2);
  return {
    overall_health: finalFindings.some((f) => f.severity === "red") ? "Weak" : finalFindings.length ? "Needs Work" : "Strong",
    findings: finalFindings,
    bottom_line: finalFindings.length ? "Prioritise the listed source-data fixes before deeper editorial review." : "No obvious source-data issue was detected in the article fields.",
    source_audit: true,
    word_count: wordCount,
    source_signals: sourceSignals,
    expert_signals: expertSignals,
    _usage: { input_tokens: 0, output_tokens: 0 },
  };
}

function extractUrlFromRow(parts) {
  return parts.find((part) => /^https?:\/\//i.test(String(part || "").trim())) || "";
}

function guessSegmentFromUrl(url) {
  try {
    const parsed = new URL(url);
    const pathParts = parsed.pathname.split("/").filter(Boolean);
    return pathParts[0] || "imported-urls";
  } catch (e) {
    return "imported-urls";
  }
}

function parseImportedUrlText(text) {
  const lines = String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  if (!lines.length) return [];
  const firstParts = lines[0].split(/\t|,/).map((part) => part.trim());
  const hasHeader = firstParts.some((part) => /url|segment/i.test(part));
  const headerMap = hasHeader ? Object.fromEntries(firstParts.map((part, index) => [part.toLowerCase(), index])) : {};
  const rows = hasHeader ? lines.slice(1) : lines;
  return rows.map((line) => {
    if (/^https?:\/\//i.test(line)) return { url: line, segment: "" };
    const parts = line.split(/\t|,/).map((part) => part.trim());
    if (headerMap.url !== undefined) {
      return {
        url: parts[headerMap.url] || "",
        segment: headerMap.segment !== undefined ? (parts[headerMap.segment] || "") : "",
      };
    }
    const url = extractUrlFromRow(parts);
    const segment = parts.length > 1 && parts[0] !== url ? parts[0] : "";
    return { url, segment };
  }).filter((row) => row.url);
}

function normalizeImportedArticle(article, preferredSegment, sourceUrl) {
  const normalized = normalizeArticles([article], preferredSegment || guessSegmentFromUrl(sourceUrl))[0];
  return normalized ? { ...normalized, segment: preferredSegment || normalized.segment || guessSegmentFromUrl(sourceUrl), url: normalized.url || sourceUrl } : null;
}

async function fetchImportedArticleByUrl(url, preferredSegment) {
  let parsedUrl;
  try {
    parsedUrl = new URL(url);
  } catch (e) {
    throw new Error(`Invalid URL: ${url}`);
  }
  if (!/financialexpress\.com$/i.test(parsedUrl.hostname)) {
    throw new Error("Only Financial Express article URLs are supported right now.");
  }

  const path = parsedUrl.pathname.replace(/\/+$/, "");
  const postId = path.match(/-(\d+)$/)?.[1] || path.match(/\/(\d+)$/)?.[1];
  if (postId) {
    const article = await fetchWpJson(buildSourceApiUrl("post", { id: postId }));
    return normalizeImportedArticle(article, preferredSegment, url);
  }

  const slug = path.split("/").filter(Boolean).pop() || "";
  if (!slug) throw new Error(`Could not detect a post from URL: ${url}`);
  const matches = await fetchWpJson(buildSourceApiUrl("posts", { slug }));
  if (!Array.isArray(matches) || !matches.length) throw new Error(`No FE article was found for URL: ${url}`);
  return normalizeImportedArticle(matches[0], preferredSegment, url);
}

function downloadCsv(rows, filename) {
  const esc = (v) => { const s = String(v ?? ""); return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s; };
  const header = ["segment", "headline", "url", "byline", "publish_date", "verdict", "top_finding", "evidence", "why_it_hurts", "fix", "optimization_steps", "expected_improvement", "ymyl_score", "experience", "expertise", "authoritativeness", "trustworthiness", "information_gain_score", "spam_risk"];
  const lines = [header.join(",")];
  rows.forEach((r) => lines.push(header.map((h) => esc(r[h])).join(",")));
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  async function scanSegmentAvailability(currentSegments, currentSegmentIds, monthValue, existingArticles = {}) {
    if (!currentSegments.length) return {};
    const updates = {};
    const queue = [...currentSegments];
    const workerCount = Math.min(SEGMENT_SCAN_CONCURRENCY, currentSegments.length);
    await Promise.all(Array.from({ length: workerCount }, async () => {
      while (queue.length) {
        const segment = queue.shift();
        if (!segment || !currentSegmentIds[segment]) continue;
        const status = await checkSegmentAvailability(segment, currentSegmentIds[segment], monthValue);
        updates[segment] = existingArticles[segment]?.length ? { type: "ok", reason: "" } : (status.type === "ready" ? { type: "idle", reason: "" } : status);
      }
    }));
    return updates;
  }

  function applySegments(categories) {
    const cleanCategories = categories.filter((c) => c?.slug && c?.id && Number(c.count || 0) > 0);
    const slugs = cleanCategories.map((c) => c.slug);
    if (slugs.length === 0) throw new Error("No active segments were found.");
    return {
      slugs,
      ids: Object.fromEntries(cleanCategories.map((c) => [c.slug, c.id])),
    };
  }

  async function loadSegments() {
    setLoadMsg("Loading all active FE segments...");
    setCheckingSegments(true);
    try {
      const first = await fetchJsonWithMeta(buildSourceApiUrl("categories", { per_page: 100, page: 1 }));
      let categories = Array.isArray(first.data) ? first.data : [];
      for (let page = 2; page <= first.totalPages; page++) {
        const next = await fetchJsonWithMeta(buildSourceApiUrl("categories", { per_page: 100, page }));
        categories = categories.concat(Array.isArray(next.data) ? next.data : []);
      }
      const prepared = applySegments(categories);
      setLoadMsg(`Checking page availability for ${monthOptions.find((option) => option.value === selectedMonth)?.label}...`);
      const statuses = await scanSegmentAvailability(prepared.slugs, prepared.ids, selectedMonth);
      const firstUsableSegment = prepared.slugs.find((segment) => statuses[segment]?.type !== "empty" && statuses[segment]?.type !== "unsupported") || prepared.slugs[0];
      setSegments(prepared.slugs);
      setSegmentIds(prepared.ids);
      setSegmentStatus(statuses);
      setActiveSegment(firstUsableSegment);
      setStep(2);
      setLoadMsg(`${categories.filter((c) => c?.slug && c?.id && Number(c.count || 0) > 0).length} active segments loaded.`);
    } catch (apiError) {
      try {
        const parsed = JSON.parse(categoriesJson);

        const prepared = applySegments(categories);

        const statuses = await scanSegmentAvailability(prepared.slugs, prepared.ids, selectedMonth);
        const firstUsableSegment = prepared.slugs.find((segment) => statuses[segment]?.type !== "empty" && statuses[segment]?.type !== "unsupported") || prepared.slugs[0];

  function selectAllLoadedArticles(limit) {

  async function addArticlesFromRaw(raw, currentOffset) {
    const wpError = detectWpRestError(raw);

    if (wpError) {
      if (currentOffset === 0) {
        setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "unsupported", reason: `${wpError.status} ${wpError.code.replace(/_/g, " ")} - the first page failed, so this segment is probably unavailable through FE's article API.` } }));
        setLoadMsg(`"${activeSegment}" is unavailable through this API.`);
      } else {
        setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "end-of-range", reason: `Reached the end of available articles (no more after #${currentOffset}).` } }));
        setLoadMsg(`All available articles in "${activeSegment}" have been loaded.`);
      }
      return;
    }

    const { after, before } = getMonthRange(selectedMonth);
    const normalized = normalizeArticles(raw, activeSegment).filter((article) => {
      const published = new Date(String(article.publish_date).replace(" ", "T"));
      return !Number.isNaN(published.getTime()) && published >= new Date(after) && published < new Date(before);
    });
    const arts = await resolveBylines(normalized);
    if (arts.length === 0) {
      setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "empty", reason: `No pages were published in ${monthOptions.find((option) => option.value === selectedMonth)?.label}. Try another month or use Last 12 months.` } }));
      setLoadMsg(`No articles were found for "${activeSegment}" in ${monthOptions.find((option) => option.value === selectedMonth)?.label}.`);
      return;
    }

    setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "ok", reason: "" } }));
    setSegmentArticles((prev) => {
      const existing = prev[activeSegment] || [];
      const existingIds = new Set(existing.map((a) => a.id));
      const added = arts.filter((a) => !existingIds.has(a.id));
      if (added.length) {
        setSelectedArticleIds((current) => {
          const next = { ...current };
          added.forEach((article) => { next[article.id] = true; });
          return next;
        });
      }
      return { ...prev, [activeSegment]: [...existing, ...added] };
    });
    setSegmentOffsets((prev) => ({ ...prev, [activeSegment]: currentOffset + clampArticlesPerPage(articlesPerPage) }));
    setArticlesJson("");
    setLoadMsg(`Added ${arts.length} articles to "${activeSegment}".`);
  }

  async function loadArticlesForSegment() {
    if (!activeSegment || !segmentIds[activeSegment]) { setLoadMsg("Select a segment first."); return; }
    const perPage = clampArticlesPerPage(articlesPerPage);
    const currentOffset = segmentOffsets[activeSegment] || 0;
    const page = Math.floor(currentOffset / perPage) + 1;
    setLoadMsg(`Loading page ${page} for "${activeSegment}"...`);
    try {
      const result = await fetchJsonWithMeta(buildArticleUrl(segmentIds[activeSegment], selectedMonth, perPage, page));
      await addArticlesFromRaw(result.data, currentOffset);
      if (page >= result.totalPages) {
        setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "end-of-range", reason: `Loaded all ${result.total} available articles for this date range.` } }));
      }
    } catch (apiError) {
      if (articlesJson.trim()) {
        try { await addArticlesFromRaw(JSON.parse(articlesJson), segmentOffsets[activeSegment] || 0); }
        catch (pasteError) { setLoadMsg(toUserMessage(apiError.message, "The selected pages could not be loaded.")); }
      } else {
        try {
          const fallbackArticles = await fetchLatestFallbackArticles(activeSegment, segmentIds[activeSegment], selectedMonth, perPage);
          if (fallbackArticles.length) {
            await addArticlesFromRaw({ list: [{ items: fallbackArticles.map((article) => ({
              id: article.id,
              headline: article.headline,
              introduction: article.subheading,
              byline: article.byline ? article.byline.split(", ").map((name) => ({ name })) : [],
              post_date: article.publish_date,
              body_raw: article.body_text,
              post_url: article.url,
              categories: [{ id: String(segmentIds[activeSegment]), slug: activeSegment }],
            })) }] }, segmentOffsets[activeSegment] || 0);
            setLoadMsg(`Loaded ${fallbackArticles.length} pages for "${activeSegment}".`);
            return;
          }
        } catch (fallbackError) {
          setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "unsupported", reason: "This segment could not be loaded from the current source for the selected month." } }));
          setLoadMsg(`"${activeSegment}" could not be loaded for the selected month.`);
          return;
        }
        setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: "empty", reason: `No pages were found for "${activeSegment}" in ${monthOptions.find((option) => option.value === selectedMonth)?.label}.` } }));
        setLoadMsg(`No articles were found for "${activeSegment}" in ${monthOptions.find((option) => option.value === selectedMonth)?.label}.`);
      }
    }
  }

  async function loadAllPagesForSegment() {
    if (!activeSegment || !segmentIds[activeSegment]) { setLoadMsg("Select a segment first."); return; }
    const perPage = clampArticlesPerPage(articlesPerPage);
    const startPage = Math.floor((segmentOffsets[activeSegment] || 0) / perPage) + 1;
    setLoadingArticles(true);
    try {
      let total = 0;
      let totalPages = startPage;
      for (let page = startPage; page <= totalPages && page < startPage + MAX_AUTO_PAGES_PER_SEGMENT; page++) {
        setLoadMsg(`Loading ${activeSegment}, page ${page}...`);
        const result = await fetchJsonWithMeta(buildArticleUrl(segmentIds[activeSegment], selectedMonth, perPage, page));
        total = result.total;
        totalPages = result.totalPages;
        await addArticlesFromRaw(result.data, (page - 1) * perPage);
        if (!Array.isArray(result.data) || result.data.length === 0) break;
      }
      const reachedCap = totalPages >= startPage + MAX_AUTO_PAGES_PER_SEGMENT;
      setSegmentStatus((prev) => ({ ...prev, [activeSegment]: { type: reachedCap ? "ok" : "end-of-range", reason: reachedCap ? `Paused after ${MAX_AUTO_PAGES_PER_SEGMENT} pages. Load again to continue.` : `Loaded all ${total} available articles for this date range.` } }));
      setLoadMsg(reachedCap ? `Loaded another ${MAX_AUTO_PAGES_PER_SEGMENT} pages for "${activeSegment}". Load again to continue.` : `Loaded all available articles for "${activeSegment}".`);

  async function importOwnUrls() {
    const rows = parseImportedUrlText(importUrlsText);
    if (!rows.length) {
      setLoadMsg("Add one FE URL per line, or upload a CSV/TSV with `url` and optional `segment` columns.");
      return;
    }
    setLoadingArticles(true);
    const imported = [];
    try {
      for (let i = 0; i < rows.length; i++) {
        setProgress(`Importing ${i + 1} of ${rows.length} URLs...`);
        const article = await fetchImportedArticleByUrl(rows[i].url, rows[i].segment);
        if (article) imported.push(article);
      }
    } catch (error) {
      setLoadingArticles(false);
      setProgress("");
      setLoadMsg(toUserMessage(error.message, "The imported URLs could not be loaded."));
      return;
    }

    const grouped = imported.reduce((acc, article) => {
      const segment = article.segment || "imported-urls";
      if (!acc[segment]) acc[segment] = [];
      acc[segment].push(article);
      return acc;
    }, {});

    setSegments((prev) => {
      const next = [...prev];
      Object.keys(grouped).forEach((segment) => { if (!next.includes(segment)) next.push(segment); });
      return next;
    });
    setSegmentArticles((prev) => {
      const next = { ...prev };
      Object.entries(grouped).forEach(([segment, articles]) => {
        const existing = next[segment] || [];
        const existingIds = new Set(existing.map((article) => article.id));
        const added = articles.filter((article) => !existingIds.has(article.id));
        next[segment] = [...existing, ...added];
        if (added.length) {
          setSelectedArticleIds((current) => {
            const nextSelection = { ...current };
            added.forEach((article) => { nextSelection[article.id] = true; });
            return nextSelection;
          });
        }
      });
      return next;
    });
    const firstSegment = Object.keys(grouped)[0];
    if (firstSegment) setActiveSegment(firstSegment);
    setStep(3);
    setLoadMsg(`Imported ${imported.length} FE article URLs from ${importFileName || "the pasted list"}. They are ready to run in Step 3.`);
    setProgress("");
    setLoadingArticles(false);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  const totalArticles = Object.values(segmentArticles).flat().length;
  const allLoadedArticles = Object.values(segmentArticles).flat();
  const selectedArticles = allLoadedArticles.filter((article) => selectedArticleIds[article.id]);
  const recommendationCap = clampRecommendationLimit(recommendationLimit, totalArticles || 50);
  const selectedRecommendationArticles = selectedArticles.slice(0, recommendationCap);
  const segmentsWithArticles = Object.keys(segmentArticles).filter((sg) => segmentArticles[sg]?.length > 0);
  const unsupportedSegments = Object.entries(segmentStatus).filter(([, v]) => v.type === "unsupported");
  const emptySegments = Object.entries(segmentStatus).filter(([, v]) => v.type === "empty");
  const filteredSegments = segments.filter((sg) => sg.toLowerCase().includes(segmentSearch.toLowerCase()));

  async function analyzeAll() {
    const allArticles = selectedRecommendationArticles;
    if (!allArticles.length) {
      setLoadMsg("Select at least one page before running recommendations.");
      return;
    }
    if (analysisMode === "source") {
      if (allArticles.length > SOURCE_AUDIT_LIMIT) {
        setLoadMsg(`This source-only run has ${allArticles.length} articles. Reduce it to ${SOURCE_AUDIT_LIMIT} or fewer for browser reliability.`);
        return;
      }
      setAnalyzing(true); setStep(4);
      const sourceResults = {};
      allArticles.forEach((article, index) => {
        sourceResults[article.id] = buildSourceOnlyResult(article);
        if ((index + 1) % 100 === 0) setProgress(`Pre-audited ${index + 1} of ${allArticles.length}...`);
      });
      setResults(sourceResults);
      setProgress(""); setAnalyzing(false);
      return;
    }
    if (allArticles.length > MAX_ANALYSIS_ARTICLES) {
      setLoadMsg(`This run has ${allArticles.length} articles. Reduce it to ${MAX_ANALYSIS_ARTICLES} or fewer before analysing.`);
      return;
    }
    stopAnalysisRef.current = false;
    setAnalysisNotice("");
    setAnalyzing(true); setStep(4);
    const newResults = {};
    let consecutiveUpstreamErrors = 0;
    for (let i = 0; i < allArticles.length; i++) {
      if (stopAnalysisRef.current) {
        setAnalysisNotice(`Analysis stopped after ${i} of ${allArticles.length} pages.`);
        break;
      }
      setProgress(`Analyzing ${i + 1} of ${allArticles.length}...`);
      const requestStarted = Date.now();
      try {
        newResults[allArticles[i].id] = await callAnalyzeApi(allArticles[i], analysisMode, costProfile, aiProvider, aiModel);
        consecutiveUpstreamErrors = 0;
      }
      catch (e) {
        const message = String(e.message || e);
        const isUpstream = /Upstream API error|Rate limit exceeded|Server misconfigured|Daily request cap reached/i.test(message);
        newResults[allArticles[i].id] = {
          overall_health: "Weak",
          findings: [{
            severity: "red",
            issue_name: "Analysis could not complete",
            evidence: isUpstream ? "The analysis provider did not return a usable result." : "This page could not be scored in the current run.",
            what_is_wrong: toUserMessage(message, "The analysis could not finish for this page."),
            why_it_hurts: isUpstream ? "The run should stop before more paid requests are used." : "This page was skipped without a final recommendation.",
            fix: isUpstream ? "Retry after confirming the selected provider and model." : "Retry this page in a new run.",
          }],
          _failed: true,
        };
        consecutiveUpstreamErrors = isUpstream ? consecutiveUpstreamErrors + 1 : 0;
        if (consecutiveUpstreamErrors >= MAX_CONSECUTIVE_UPSTREAM_ERRORS) {
          setResults({ ...newResults });
          setAnalysisNotice(`Analysis stopped automatically after ${consecutiveUpstreamErrors} consecutive paid API failures. Check the provider, model, or API key before retrying.`);
          break;
        }
      }
      setResults({ ...newResults });
      if (i < allArticles.length - 1) await wait(Math.max(0, ANALYSIS_INTERVAL_MS - (Date.now() - requestStarted)));
    }
    setProgress(""); setAnalyzing(false);
  }

  async function retryFailed() {
    stopAnalysisRef.current = false;
    setAnalysisNotice("");
    setAnalyzing(true);
    const allArticles = selectedRecommendationArticles;
    const failedIds = Object.entries(results).filter(([, r]) => r._failed).map(([id]) => id);
    const toRetry = allArticles.filter((a) => failedIds.includes(a.id));
    const newResults = { ...results };
    let consecutiveUpstreamErrors = 0;
    for (let i = 0; i < toRetry.length; i++) {
      if (stopAnalysisRef.current) {
        setAnalysisNotice(`Retry stopped after ${i} of ${toRetry.length} pages.`);
        break;
      }
      setProgress(`Retrying ${i + 1} of ${toRetry.length}...`);
      const requestStarted = Date.now();
      try {
        newResults[toRetry[i].id] = await callAnalyzeApi(toRetry[i], analysisMode, costProfile, aiProvider, aiModel);
        consecutiveUpstreamErrors = 0;
      }
      catch (e) {
        const message = String(e.message || e);
        const isUpstream = /Upstream API error|Rate limit exceeded|Server misconfigured|Daily request cap reached/i.test(message);
        newResults[toRetry[i].id] = {
          overall_health: "Weak",
          findings: [{
            severity: "red",
            issue_name: "Analysis could not complete",
            evidence: isUpstream ? "The analysis provider did not return a usable result." : "This page could not be scored in the current run.",
            what_is_wrong: toUserMessage(message, "The analysis could not finish for this page."),
            why_it_hurts: isUpstream ? "The provider is still failing, so repeated retries are likely to use more paid requests." : "This page was skipped without a final recommendation.",
            fix: isUpstream ? "Confirm the selected provider and model before retrying." : "Retry this page in a new run.",
          }],
          _failed: true,
        };
        consecutiveUpstreamErrors = isUpstream ? consecutiveUpstreamErrors + 1 : 0;
        if (consecutiveUpstreamErrors >= MAX_CONSECUTIVE_UPSTREAM_ERRORS) {
          setResults({ ...newResults });
          setAnalysisNotice(`Retry stopped automatically after ${consecutiveUpstreamErrors} consecutive paid API failures.`);
          break;
        }
      }
      setResults({ ...newResults });
      if (i < toRetry.length - 1) await wait(Math.max(0, ANALYSIS_INTERVAL_MS - (Date.now() - requestStarted)));
    }
    setProgress(""); setAnalyzing(false);
  }

  function stopAnalysis() {
    stopAnalysisRef.current = true;
    setProgress("Stopping after the current request finishes...");
  }

  function buildCsvRows() {
    const allArticles = Object.values(segmentArticles).flat();
    return Object.entries(results).map(([id, r]) => {
      const a = allArticles.find((x) => x.id === id);
      const top = r.findings?.[0];
      return {
        segment: a?.segment, headline: a?.headline, url: a?.url, byline: a?.byline, publish_date: a?.publish_date,
        verdict: r.verdict || r.overall_health,
        top_finding: top ? `${top.severity === "red" ? "RED" : "YELLOW"} ${top.issue_name}: ${top.what_is_wrong}` : "None",
        evidence: top?.evidence, why_it_hurts: top?.why_it_hurts, fix: top?.fix,
        optimization_steps: top?.optimization_steps?.join(" | "), expected_improvement: top?.expected_improvement,
        ymyl_score: r.ymyl_score ?? "", experience: r.experience ?? r.experience_score ?? "", expertise: r.expertise ?? "",
        authoritativeness: r.authoritativeness ?? "", trustworthiness: r.trustworthiness ?? r.trust_score ?? "",
        information_gain_score: r.information_gain_score ?? "", spam_risk: r.spam_risk ?? "",
        word_count: r.word_count ?? "", source_signals: r.source_signals ?? "", expert_signals: r.expert_signals ?? "",
        input_tokens: r._usage?.input_tokens ?? "", output_tokens: r._usage?.output_tokens ?? "",
      };
    });
  }

  function exportCsv() { downloadCsv(buildCsvRows(), `fe-audit-${new Date().toISOString().slice(0, 10)}.csv`); }
  function exportSavedCsv(entry) { downloadCsv(entry.rows, `fe-audit-${entry.timestamp.slice(0, 10)}.csv`); }

  function saveToMemory() {
    const rows = buildCsvRows();
    if (rows.length === 0) { setSavedMsg("Nothing to save yet."); return; }
    const entry = { timestamp: new Date().toISOString(), mode: analysisMode, segments: [...new Set(rows.map((r) => r.segment))], articleCount: rows.length, rows };
    addSavedAnalysis(entry);
    setSavedAnalyses(getSavedAnalyses());
    setSavedMsg(`Saved ${rows.length} articles in this browser.`);
  }

  function deleteSaved(timestamp) { deleteSavedAnalysis(timestamp); setSavedAnalyses(getSavedAnalyses()); }

  const resultEntries = Object.entries(results);
  const failedCount = Object.values(results).filter((r) => r._failed).length;
  const sourceOnlyCount = Object.values(results).filter((r) => r.source_audit).length;
  const segmentSummary = segmentsWithArticles.map((seg) => {
    const arts = segmentArticles[seg] || [];
    const segResults = arts.map((a) => results[a.id]).filter(Boolean);
    const red = segResults.reduce((sum, r) => sum + (r.findings?.filter((f) => f.severity === "red").length || 0), 0);
    const yellow = segResults.reduce((sum, r) => sum + (r.findings?.filter((f) => f.severity === "yellow").length || 0), 0);
    return { seg, total: arts.length, analyzed: segResults.length, red, yellow };
  });

  if (!authed) return <LoginScreen onSuccess={() => setAuthed(true)} />;

  return (
    <div>
      <div className="page-header">
        <div><p className="login-kicker">Content operations dashboard</p><h1 style={st.h1}>FE Content Audit</h1><p style={st.subtitle}>Load FE segments, pre-audit pages at scale, and reserve Claude analysis for priority reviews.</p></div>
        <button style={st.btnOutline} onClick={() => { clearSession(); setAuthed(false); }}>Log out</button>
      </div>

      <div className="dashboard-grid">
        <div className="metric-card"><p className="metric-label">Segments</p><p className="metric-value">{segments.length}</p></div>
        <div className="metric-card"><p className="metric-label">Loaded articles</p><p className="metric-value">{totalArticles}</p></div>
        <div className="metric-card"><p className="metric-label">Analysed</p><p className="metric-value">{resultEntries.length}</p></div>
        <div className="metric-card"><p className="metric-label">No-cost audits</p><p className="metric-value">{sourceOnlyCount}</p></div>
      </div>

      <div style={st.card}>
        <p className="step-label">Step 1</p>
        <p style={st.stepTitle}>Load segments</p>
        <p style={st.stepDesc}>Load all active FE segments from the preprod WordPress source. The product handles the source request automatically after login.</p>
        <div style={{ marginTop: "12px" }}><button style={st.btnPrimary} onClick={loadSegments}>Load all segments</button></div>
        {segments.length > 0 && <p style={{ fontSize: "13px", color: C.success, marginTop: "10px", fontWeight: 700 }}>Loaded {segments.length} active segments.</p>}
        {loadMsg && step === 1 && <p style={{ fontSize: "13px", color: C.error, marginTop: "8px" }}>{loadMsg}</p>}
      </div>

      <div style={st.cardLavender}>
        <p className="step-label">Workspace</p>
        <p style={{ ...st.stepTitle, fontSize: "18px" }}>Saved analyses (this browser)</p>
        <p style={st.stepDesc}>Export or delete previous analyses without running them again.</p>
        {savedMsg && <p style={{ fontSize: "13px", color: C.success, marginBottom: "8px" }}>{savedMsg}</p>}
        {savedAnalyses.length === 0 ? <p style={st.caption}>No saved analyses yet.</p> : (
          <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
            {savedAnalyses.map((entry) => (
              <div className="saved-row" key={entry.timestamp} style={{ alignItems: "center", background: C.canvas, borderRadius: "8px", padding: "10px 14px", fontSize: "13px" }}>
                <span><strong>{new Date(entry.timestamp).toLocaleString()}</strong> - {entry.articleCount} articles - {entry.segments.join(", ")}</span>
                <span className="saved-actions">
                  <button style={{ ...st.btnOutline, padding: "5px 14px", fontSize: "12px" }} onClick={() => exportSavedCsv(entry)}>Export CSV</button>
                  <button style={{ ...st.btnOutlineError, padding: "5px 14px", fontSize: "12px" }} onClick={() => deleteSaved(entry.timestamp)}>Delete</button>
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      {step >= 2 && (
        <div style={st.card}>
          <p className="step-label">Step 2</p>
          <p style={st.stepTitle}>Load articles for each segment</p>
          <p style={st.stepDesc}>Choose the date range, wait for the segment check to finish, then load one page or all available pages for a valid segment.</p>
          <label style={{ display: "block", fontSize: "13px", fontWeight: 700, marginBottom: "12px" }}>Publication month<br /><select aria-label="Publication month" style={{ width: "100%", marginTop: "6px" }} value={selectedMonth} onChange={(e) => selectMonth(e.target.value)}>{monthOptions.map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}</select></label>
          <input style={{ width: "100%", marginBottom: "10px" }} placeholder="Search segments" value={segmentSearch} onChange={(e) => setSegmentSearch(e.target.value)} />
          <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "14px", maxHeight: "140px", overflowY: "auto" }}>
            {filteredSegments.map((sg) => {
              const status = segmentStatus[sg];
              const isUnavailable = status?.type === "unsupported";
              const isEmpty = status?.type === "empty";
              const isLoaded = status?.type === "ok";
              const pillStyle = sg === activeSegment ? st.pillTagActive : isUnavailable ? st.pillTagBad : isEmpty ? st.pillTagWarn : st.pillTag;
              return <button key={sg} style={{ ...pillStyle, opacity: isUnavailable || isEmpty || checkingSegments ? 0.92 : 1 }} onClick={() => selectSegment(sg)} disabled={isUnavailable || isEmpty || checkingSegments}>{isUnavailable && "Unavailable "}{isEmpty && "No pages "}{isLoaded && "Loaded "}{sg}{segmentArticles[sg]?.length ? ` (${segmentArticles[sg].length})` : ""}</button>;
            })}
          </div>
          {checkingSegments && <p style={{ ...st.caption, marginTop: "-4px", marginBottom: "10px" }}>Checking which segments have valid pages for this month/year. This now runs before page loading so unavailable categories are flagged early.</p>}
          <div style={{ display: "flex", gap: "10px", alignItems: "center", marginBottom: "10px" }}>
            <span style={{ fontWeight: 700, fontSize: "14px" }}>Selected: {activeSegment || "none"}</span>
            <label style={st.caption}>Articles per fetch:</label>
            <input type="number" min="1" max={MAX_ARTICLES_PER_REQUEST} style={{ width: "74px" }} value={articlesPerPage} onChange={(e) => setArticlesPerPage(clampArticlesPerPage(e.target.value))} />
          </div>
          <p style={{ ...st.caption, marginTop: "-4px" }}>The preprod WordPress source can return up to {MAX_ARTICLES_PER_REQUEST} articles per fetch. Use "Load all available pages" to collect larger month-wise batches.</p>
          {segmentStatus[activeSegment]?.type === "unsupported" && <div style={{ background: C.errorTint, color: C.error, borderRadius: "8px", padding: "10px 14px", fontSize: "13px", marginBottom: "10px" }}>{segmentStatus[activeSegment].reason}</div>}
          {segmentStatus[activeSegment]?.type === "empty" && <div style={{ background: C.warnTint, color: C.warn, borderRadius: "8px", padding: "10px 14px", fontSize: "13px", marginBottom: "10px" }}>{segmentStatus[activeSegment].reason}</div>}
          {segmentStatus[activeSegment]?.type === "end-of-range" && <div style={{ background: C.successTint, color: C.success, borderRadius: "8px", padding: "10px 14px", fontSize: "13px", marginBottom: "10px" }}>{segmentStatus[activeSegment].reason}</div>}
          {activeSegment && (
            <React.Fragment>
              <p style={st.caption}>Next page: {Math.floor((segmentOffsets[activeSegment] || 0) / clampArticlesPerPage(articlesPerPage)) + 1}. Each page loads up to {clampArticlesPerPage(articlesPerPage)} articles from {monthOptions.find((option) => option.value === selectedMonth)?.label}.</p>
              <p style={{ ...st.caption, marginBottom: "10px" }}>Source: preprod WordPress. Page data is loaded automatically inside the app after login.</p>
              <div style={{ marginTop: "10px", display: "flex", gap: "8px", flexWrap: "wrap" }}>
                <button style={st.btnPrimary} onClick={loadArticlesForSegment} disabled={loadingArticles || checkingSegments}>Load next page</button>
                <button style={st.btnOutline} onClick={loadAllPagesForSegment} disabled={loadingArticles || checkingSegments}>Load all available pages</button>
              </div>
            </React.Fragment>
          )}
          {loadMsg && <p style={{ fontSize: "13px", color: /loaded|added|saved/i.test(loadMsg) ? C.success : C.error, marginTop: "10px", fontWeight: 600 }}>{loadMsg}</p>}
          <div style={{ marginTop: "18px", paddingTop: "16px", borderTop: `1px solid ${C.hairline}` }}>
            <p style={{ fontSize: "14px", fontWeight: 700, margin: "0 0 6px" }}>Import your own FE URLs</p>
            <p style={st.stepDesc}>Paste one Financial Express URL per line, or upload a CSV/TSV exported from Google Sheets or Google Drive. Supported columns: `url` and optional `segment`. Excel `.xlsx` files should be exported to CSV first.</p>
            <textarea style={{ minHeight: "96px", marginBottom: "10px" }} value={importUrlsText} onChange={(e) => setImportUrlsText(e.target.value)} placeholder={"Examples:\nhttps://www.financialexpress.com/business/...-4312602/\nmarkets,https://www.financialexpress.com/market/...-4312501/"} />
            <div className="toolbar-row">
              <input type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" onChange={handleImportFile} />
              {importFileName && <span style={st.caption}>Loaded file: {importFileName}</span>}
            </div>
            <div style={{ marginTop: "10px" }}>
              <button style={st.btnOutline} onClick={importOwnUrls} disabled={loadingArticles || checkingSegments}>Import FE URLs</button>
              {totalArticles > 0 && <button style={{ ...st.btnPrimary, marginLeft: "10px" }} onClick={() => setStep(3)}>Review and run imported pages ({totalArticles})</button>}
            </div>
            {importedArticlesCount > 0 && <p style={{ fontSize: "13px", color: C.success, marginTop: "10px", fontWeight: 600 }}>{importedArticlesCount} imported URLs are ready in Step 3.</p>}
          </div>
          {unsupportedSegments.length > 0 && (
            <div style={{ marginTop: "14px", borderTop: `1px solid ${C.hairline}`, paddingTop: "12px" }}>
              <p style={{ fontSize: "13px", fontWeight: 700, color: C.error, margin: "0 0 6px" }}>Segments that could not be loaded for this month:</p>
              {unsupportedSegments.map(([sg, v]) => <p key={sg} style={{ fontSize: "12px", color: C.error, margin: "0 0 4px" }}><strong>{sg}</strong>: {v.reason}</p>)}
            </div>
          )}
          {emptySegments.length > 0 && (
            <div style={{ marginTop: "14px", borderTop: `1px solid ${C.hairline}`, paddingTop: "12px" }}>
              <p style={{ fontSize: "13px", fontWeight: 700, color: C.warn, margin: "0 0 6px" }}>Segments with no pages in this date range:</p>
              {emptySegments.map(([sg, v]) => <p key={sg} style={{ fontSize: "12px", color: C.warn, margin: "0 0 4px" }}><strong>{sg}</strong>: {v.reason}</p>)}
            </div>
          )}
          {segmentsWithArticles.length > 0 && <div style={{ marginTop: "14px" }}><button style={st.btnPrimary} onClick={() => setStep(3)}>Continue to review ({totalArticles} total)</button></div>}
        </div>
      )}

      {step >= 3 && totalArticles > 0 && (
        <div style={st.card}>
          <p className="step-label">Step 3</p>
          <p style={st.stepTitle}>Review before analysis</p>
          <p style={st.stepDesc}>{totalArticles} articles across {segmentsWithArticles.length} segment(s). Choose exactly which pages should receive recommendations, then decide whether to use the FE API recommendation flow or a quick local screen. Paid runs now stop automatically if the provider keeps failing.</p>
          <div className="toolbar-row" style={{ marginBottom: "12px" }}>
            <label style={{ fontSize: "13px", fontWeight: 700 }}>
              Recommendation count
              <br />
              <select aria-label="Recommendation count" style={{ width: "160px", marginTop: "6px" }} value={recommendationCap} onChange={(e) => setRecommendationLimit(Number(e.target.value))}>
                {RECOMMENDATION_COUNT_OPTIONS.filter((count) => count <= Math.max(totalArticles, 50)).map((count) => <option key={count} value={count}>{count} pages</option>)}
                {totalArticles > RECOMMENDATION_COUNT_OPTIONS[RECOMMENDATION_COUNT_OPTIONS.length - 1] && <option value={Math.min(totalArticles, recommendationCap)}>{Math.min(totalArticles, recommendationCap)} pages</option>}
              </select>
            </label>
            <button style={st.btnOutline} onClick={() => selectAllLoadedArticles(recommendationCap)}>Select first {recommendationCap}</button>
            <button style={st.btnOutline} onClick={() => setSelectedArticleIds(Object.fromEntries(allLoadedArticles.map((article) => [article.id, true])))}>Select all loaded</button>
            <button style={st.btnOutlineError} onClick={() => setSelectedArticleIds({})}>Clear selection</button>
            <span style={st.caption}>{selectedArticles.length} selected, {selectedRecommendationArticles.length} will run recommendations.</span>
          </div>
          {analysisNotice && <p style={{ fontSize: "13px", color: C.warn, margin: "0 0 12px", fontWeight: 600 }}>{analysisNotice}</p>}
          <div style={{ maxHeight: "260px", overflowY: "auto", border: `1px solid ${C.hairline}`, borderRadius: "8px" }}>
            {segmentsWithArticles.map((seg) => (
              <div key={seg}>
                <div style={{ background: C.cream, padding: "8px 14px", fontSize: "13px", fontWeight: 700 }}>{seg} ({segmentArticles[seg].length})</div>
                {segmentArticles[seg].map((a) => (
                  <label key={a.id} style={{ display: "flex", gap: "10px", alignItems: "flex-start", padding: "8px 14px", fontSize: "13px", borderBottom: `1px solid ${C.hairline}`, cursor: "pointer" }}>
                    <input type="checkbox" checked={Boolean(selectedArticleIds[a.id])} onChange={(e) => toggleArticleSelection(a.id, e.target.checked)} style={{ marginTop: "2px" }} />
                    <span>{a.headline} <span style={st.caption}>- {a.byline || "No byline"} - {formatDate(a.publish_date)}</span></span>
                  </label>
                ))}
              </div>
            ))}
          </div>
          <div style={{ margin: "14px 0", padding: "12px 14px", background: C.lavender, borderRadius: "8px" }}>
            <p style={{ fontSize: "13px", fontWeight: 700, margin: "0 0 8px" }}>Analysis mode:</p>
            <label style={{ fontSize: "13px", marginRight: "20px" }}><input type="radio" checked={analysisMode === "fe"} onChange={() => setAnalysisMode("fe")} /> API: FE YMYL/E-E-A-T Guidelines</label>
            <label style={{ fontSize: "13px", marginRight: "20px" }}><input type="radio" checked={analysisMode === "hcs"} onChange={() => setAnalysisMode("hcs")} /> API: Google HCS / Spam Audit</label>
            <label style={{ fontSize: "13px" }}><input type="radio" checked={analysisMode === "source"} onChange={() => setAnalysisMode("source")} /> Quick local screen (no API cost)</label>
          </div>
          {analysisMode !== "source" && (
            <div style={{ marginBottom: "12px" }}>
              <p style={{ fontSize: "13px", fontWeight: 700, margin: "0 0 8px" }}>AI provider:</p>
              <label style={{ fontSize: "13px", marginRight: "20px" }}><input type="radio" checked={aiProvider === "anthropic"} onChange={() => changeAiProvider("anthropic")} /> Anthropic API</label>
              <label style={{ fontSize: "13px" }}><input type="radio" checked={aiProvider === "openai"} onChange={() => changeAiProvider("openai")} /> OpenAI API</label>
            </div>
          )}
          {analysisMode !== "source" && (
            <div style={{ marginBottom: "12px" }}>
              <p style={{ fontSize: "13px", fontWeight: 700, margin: "0 0 8px" }}>Cost profile:</p>
              <label style={{ fontSize: "13px", marginRight: "20px" }}><input type="radio" checked={costProfile === "low"} onChange={() => changeCostProfile("low")} /> Lower cost</label>
              <label style={{ fontSize: "13px" }}><input type="radio" checked={costProfile === "standard"} onChange={() => changeCostProfile("standard")} /> Higher quality</label>
            </div>
          )}
          {analysisMode !== "source" && (
            <div style={{ marginBottom: "12px" }}>
              <label style={{ display: "block", fontSize: "13px", fontWeight: 700, marginBottom: "8px" }}>
                {aiProvider === "anthropic" ? "Claude model" : "OpenAI model"}
                <br />
                <select aria-label="AI model" style={{ width: "100%", marginTop: "6px" }} value={aiModel} onChange={(e) => setAiModel(e.target.value)}>
                  {(AI_PROVIDER_OPTIONS[aiProvider] || []).map((option) => <option key={option.value} value={option.value}>{option.label}</option>)}
                </select>
              </label>
            </div>
          )}
          <p style={st.caption}>{analysisMode === "source" ? `This mode does not call Claude or OpenAI. ${selectedRecommendationArticles.length} selected pages will run in the quick local screen.` : `Current provider: ${aiProvider === "anthropic" ? "Anthropic" : "OpenAI"}. Selected model: ${aiModel}. Paid API usage depends on page length and the selected model. If the provider starts failing, the run stops automatically instead of continuing through the full batch.`}</p>
          <div className="toolbar-row">
            <button style={st.btnPrimary} onClick={analyzeAll} disabled={analyzing || checkingSegments}>{analyzing ? "Analysing..." : `Run recommendations for ${selectedRecommendationArticles.length} selected pages`}</button>
            {analyzing && <button style={st.btnOutlineError} onClick={stopAnalysis}>Stop analysis</button>}
          </div>
        </div>
      )}

      {step >= 4 && (
        <div style={st.card}>
          <p className="step-label">Step 4</p>
          <div className="result-header" style={{ alignItems: "center", gap: "12px", marginBottom: "8px" }}>
            <p style={st.stepTitle}>Content risks by segment</p>
            {analyzing && <button style={st.btnOutlineError} onClick={stopAnalysis}>Stop analysis</button>}
          </div>
          {analyzing && <p style={{ fontSize: "14px", color: C.inkMute, marginTop: 0 }}>{progress}</p>}
          {analysisNotice && <p style={{ fontSize: "13px", color: C.warn, margin: "0 0 12px", fontWeight: 600 }}>{analysisNotice}</p>}
          {segmentSummary.length > 0 && (
            <div style={{ marginBottom: "16px" }}>
              {segmentSummary.map((sm) => (
                <div key={sm.seg} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: C.cream, borderRadius: "8px", marginBottom: "6px", fontSize: "13px" }}>
                  <span style={{ fontWeight: 700 }}>{sm.seg}</span>
                  <span style={st.caption}>{sm.analyzed}/{sm.total} analysed</span>
                  <span>{sm.red > 0 && <span style={{ color: C.error, fontWeight: 700, marginRight: "10px" }}>{sm.red} red</span>}{sm.yellow > 0 && <span style={{ color: C.warn, fontWeight: 700 }}>{sm.yellow} yellow</span>}{sm.analyzed > 0 && sm.red === 0 && sm.yellow === 0 && <span style={{ color: C.success }}>Clear</span>}</span>
                </div>
              ))}
            </div>
          )}
          {resultEntries.length > 0 && (
            <React.Fragment>
              <div style={{ marginBottom: "14px", display: "flex", gap: "8px", flexWrap: "wrap" }}>
                <button style={st.btnOutline} onClick={exportCsv}>Export CSV</button>
                <button style={st.btnPrimary} onClick={saveToMemory}>Save analysis</button>
                {Object.values(results).some((r) => r._failed) && <button style={st.btnOutlineError} onClick={retryFailed} disabled={analyzing}>Retry {Object.values(results).filter((r) => r._failed).length} failed</button>}
              </div>
              {resultEntries.map(([id, r]) => {
                const a = Object.values(segmentArticles).flat().find((x) => x.id === id);
                const badgeLabel = r.verdict || r.overall_health;
                const isBad = badgeLabel === "Dead Weight" || badgeLabel === "Weak";
                const isMid = badgeLabel === "Borderline" || badgeLabel === "Needs Work";
                return (
                  <div key={id} style={{ border: `1px solid ${C.hairline}`, borderRadius: "12px", padding: "14px 16px", marginBottom: "10px" }}>
                    <div className="result-header">
                      <p style={{ fontWeight: 700, fontSize: "14px", margin: 0 }}>{a?.url ? <a href={a.url} target="_blank" rel="noopener noreferrer" style={{ color: C.linkBlue }}>{a.headline}</a> : a?.headline}</p>
                      <span style={{ fontSize: "12px", padding: "3px 12px", borderRadius: "90px", background: isBad ? C.errorTint : isMid ? C.warnTint : C.successTint, color: isBad ? C.error : isMid ? C.warn : C.success, fontWeight: 700, whiteSpace: "nowrap" }}>{badgeLabel}</span>
                    </div>
                    <p style={{ ...st.caption, margin: "4px 0 10px" }}>{a?.segment} - {a?.byline || "No byline"} - {formatDate(a?.publish_date)}</p>
                    {r.source_audit && <p style={st.caption}>Source-only pre-audit. No Claude tokens used.</p>}
                    {r._model && <p style={st.caption}>Model used: {r._model}{r._provider ? ` via ${r._provider}` : ""}{r._cost_profile ? ` (${r._cost_profile} cost profile)` : ""}</p>}
                    {r._usage && <p style={st.caption}>API usage: {r._usage.input_tokens || 0} input tokens, {r._usage.output_tokens || 0} output tokens.</p>}
                    {r.spam_risk && r.spam_risk !== "none" && <p style={{ fontSize: "12px", color: C.error, fontWeight: 700, margin: "0 0 8px" }}>Spam risk: {r.spam_risk}</p>}
                    {r.findings?.map((f, i) => (
                      <div key={i} style={{ fontSize: "13px", marginBottom: "8px", paddingLeft: "10px", borderLeft: `3px solid ${f.severity === "red" ? C.error : C.warn}` }}>
                        <strong>{f.issue_name}</strong><br /><strong>Evidence:</strong> {f.evidence}<br />{f.what_is_wrong}<br /><span style={{ color: C.inkMute }}>{f.why_it_hurts}</span><br /><strong>How to improve:</strong><ol style={{ margin: "6px 0 4px", paddingLeft: "20px" }}>{(f.optimization_steps || [f.fix]).map((step, stepIndex) => <li key={stepIndex}>{step}</li>)}</ol>{f.expected_improvement && <span style={{ color: C.inkMute }}><strong>Expected improvement:</strong> {f.expected_improvement}</span>}
                      </div>
                    ))}
                    {r.bottom_line && <p style={{ fontSize: "13px", fontStyle: "italic", marginTop: "8px" }}>{r.bottom_line}</p>}
                    <div style={{ display: "flex", gap: "12px", marginTop: "10px", fontSize: "12px", color: C.inkMute }}>
                      {r.ymyl_score !== undefined && <span>YMYL {r.ymyl_score}</span>}
                      {r.experience !== undefined && <span>Experience {r.experience}</span>}
                      {r.expertise !== undefined && <span>Expertise {r.expertise}</span>}
                      {r.authoritativeness !== undefined && <span>Authority {r.authoritativeness}</span>}
                      {r.trustworthiness !== undefined && <span>Trust {r.trustworthiness}</span>}
                      {r.information_gain_score !== undefined && <span>Information gain {r.information_gain_score}</span>}
                    </div>
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
